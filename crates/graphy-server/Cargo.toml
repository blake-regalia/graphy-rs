[package]
name = "graphy-server"
description = "SPARQL 1.1 Protocol HTTP service over graphy stores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Compile the only outbound-network capability. Runtime use still requires
# Config::allow_network (set by `graphy serve --allow-network`).
outbound-http = ["dep:reqwest", "dep:graphy-interop"]

[dependencies]
axum.workspace = true
graphy-algebra.workspace = true
graphy-core.workspace = true
graphy-protocol.workspace = true
graphy-engine.workspace = true
graphy-interop = { workspace = true, optional = true }
graphy-sparql-syntax.workspace = true
graphy-store.workspace = true
graphy-turtle.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
axum = { workspace = true, features = ["tokio", "http1"] }
reqwest = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqwest.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
