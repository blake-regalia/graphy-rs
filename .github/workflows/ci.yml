name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  miri-succinct:
    # `unsafe` is confined to graphy-succinct; keep it Miri-clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p graphy-succinct
        env:
          # Property tests are too slow under Miri; unit tests only.
          PROPTEST_DISABLE: "1"
          MIRIFLAGS: -Zmiri-strict-provenance

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo +nightly fuzz build

  wasm-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-web
      - name: Build browser package
        run: >-
          npx --yes wasm-pack@0.15.0 build --release --target web
          --out-dir pkg-web crates/graphy-wasm -- --locked
      - name: Check package layout
        run: |
          test -s crates/graphy-wasm/pkg-web/graphy_wasm.js
          test -s crates/graphy-wasm/pkg-web/graphy_wasm.d.ts
          test -s crates/graphy-wasm/pkg-web/graphy_wasm_bg.wasm
          node --check crates/graphy-wasm/pkg-web/graphy_wasm.js
          node crates/graphy-wasm/smoke-web.mjs

  wasi-cli:
    name: wasi-cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip1
            toolchain: stable
            rustup_target: wasm32-wasip1
            components: ""
          - target: wasm32-wasip2
            toolchain: stable
            rustup_target: wasm32-wasip2
            components: ""
          - target: wasm32-wasip3
            toolchain: nightly-2026-08-22
            rustup_target: ""
            components: rust-src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.rustup_target }}
          components: ${{ matrix.components }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasi-cli-${{ matrix.target }}
      - name: Build CLI module
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" = wasm32-wasip3 ]]; then
            ./scripts/build-wasip3.sh
          else
            cargo build --release --locked -p graphy-cli --target ${{ matrix.target }}
          fi
      - run: test -s target/${{ matrix.target }}/release/graphy.wasm
