name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Check tag version
        shell: bash
        run: |
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "v${crate_version}"
      - name: Build binaries
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p graphy-cli -p graphy-lsp --features graphy-cli/outbound-http
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="graphy-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/graphy" "dist/${name}/"
          cp "target/${{ matrix.target }}/release/graphy-lsp" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -r "dist/${name}"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "graphy-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name"
          Copy-Item "target/${{ matrix.target }}/release/graphy.exe" "dist/$name/"
          Copy-Item "target/${{ matrix.target }}/release/graphy-lsp.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: graphy-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  build-wasm-web:
    name: build (wasm web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm-web
      - name: Check tag version
        shell: bash
        run: |
          crate_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "v${crate_version}"
      - name: Build browser package
        run: >-
          npx --yes wasm-pack@0.15.0 build --release --target web
          --out-dir pkg-web crates/graphy-wasm -- --locked
      - name: Check package layout
        run: |
          test -s crates/graphy-wasm/pkg-web/graphy_wasm.js
          test -s crates/graphy-wasm/pkg-web/graphy_wasm.d.ts
          test -s crates/graphy-wasm/pkg-web/graphy_wasm_bg.wasm
          node --check crates/graphy-wasm/pkg-web/graphy_wasm.js
          node crates/graphy-wasm/smoke-web.mjs
      - name: Package browser archive
        shell: bash
        run: |
          name="graphy-${GITHUB_REF_NAME}-wasm-web"
          mkdir -p "dist/${name}/pkg-web"
          cp crates/graphy-wasm/pkg-web/graphy_wasm.js \
            crates/graphy-wasm/pkg-web/graphy_wasm.d.ts \
            crates/graphy-wasm/pkg-web/graphy_wasm_bg.wasm \
            crates/graphy-wasm/pkg-web/graphy_wasm_bg.wasm.d.ts \
            crates/graphy-wasm/pkg-web/package.json \
            "dist/${name}/pkg-web/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -r "dist/${name}"
      - uses: actions/upload-artifact@v7
        with:
          name: graphy-wasm-web
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: [build, build-wasm-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: graphy-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum graphy-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
